<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="images/logo.png">
    <title>Create Account | KALORA</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


<header class="simple-navbar">

    <a href="index.html"
       class="logo">

        KALORA

    </a>

    <a href="shop.html">
        Continue Shopping
    </a>

</header>



<main class="auth-page">

    <section class="auth-box">

        <p class="auth-label">
            JOIN KALORA
        </p>

        <h1>
            Create Account
        </h1>

        <p class="auth-subtitle">
            Create your account for a more personal shopping experience.
        </p>


        <form id="registerForm">


            <label>
                Full Name
            </label>

            <input
                type="text"
                id="registerName"
                placeholder="Enter your name"
                required>


            <label>
                Email Address
            </label>

            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
                required>


            <label>
                Password
            </label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Create a password"
                required>


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required>


            <button type="submit"
                    class="auth-button">

                CREATE ACCOUNT

            </button>

        </form>


        <p id="registerMessage"
           class="auth-message">
        </p>


        <p class="auth-switch">

            Already have an account?

            <a href="login.html">
                Sign In
            </a>

        </p>

    </section>

</main>


<footer class="auth-footer">

    <p>
        © 2026 KALORA. All Rights Reserved.
    </p>

</footer>


<script src="js/script.js"></script>

</body>

</html>
